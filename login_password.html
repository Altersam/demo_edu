<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Логин и пароль EDU</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#172033;
      --muted:#667085;
      --border:#dfe6ef;
      --primary:#2563eb;
      --primary-hover:#1d4ed8;
      --success:#15803d;
      --danger:#b42318;
      --shadow:0 18px 50px rgba(23,32,51,.10);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left,rgba(37,99,235,.10),transparent 34%),
        linear-gradient(180deg,#f7faff 0%,var(--bg) 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:540px;
      background:var(--card);
      border:1px solid rgba(223,230,239,.9);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:28px;
    }

    .logo{
      width:54px;
      height:54px;
      border-radius:16px;
      background:linear-gradient(135deg,#2563eb,#60a5fa);
      color:#fff;
      display:grid;
      place-items:center;
      font-weight:900;
      font-size:17px;
      margin-bottom:20px;
    }

    h1{
      margin:0 0 8px;
      font-size:30px;
      letter-spacing:-.03em;
    }

    .subtitle{
      margin:0 0 24px;
      color:var(--muted);
      line-height:1.5;
    }

    .status{
      display:none;
      margin-bottom:18px;
      padding:12px 14px;
      border-radius:12px;
      font-size:14px;
      line-height:1.45;
    }

    .status.ok{
      display:block;
      background:#ecfdf3;
      color:var(--success);
      border:1px solid #abefc6;
    }

    .status.error{
      display:block;
      background:#fef3f2;
      color:var(--danger);
      border:1px solid #fecdca;
    }

    .field{
      margin-bottom:16px;
    }

    .field label{
      display:block;
      margin-bottom:7px;
      font-size:13px;
      font-weight:800;
      color:#344054;
    }

    .row{
      display:flex;
      gap:8px;
    }

    input{
      flex:1;
      min-width:0;
      border:1px solid var(--border);
      border-radius:12px;
      background:#f9fbfd;
      padding:14px;
      font:inherit;
      font-weight:700;
      color:var(--text);
      outline:none;
    }

    button{
      border:0;
      border-radius:12px;
      font:inherit;
      font-weight:800;
      cursor:pointer;
      transition:.15s;
    }

    .copy{
      padding:0 14px;
      background:#eef2f7;
      color:#344054;
      white-space:nowrap;
    }

    .copy:hover{
      background:#e4e9f0;
    }

    .copy-all{
      width:100%;
      margin-top:8px;
      padding:14px 16px;
      background:var(--primary);
      color:#fff;
    }

    .copy-all:hover{
      background:var(--primary-hover);
    }

    .hidden{
      display:none!important;
    }

    .hint{
      margin-top:18px;
      padding-top:16px;
      border-top:1px solid #edf0f4;
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    @media(max-width:520px){
      body{padding:12px}
      .card{padding:22px 18px;border-radius:20px}
      h1{font-size:26px}
      .row{flex-direction:column}
      .copy{min-height:44px}
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">EDU</div>

    <h1>Ваши данные для входа</h1>
    <p class="subtitle">
      Скопируйте логин и пароль для входа в образовательную систему.
    </p>

    <div id="status" class="status"></div>

    <div id="credentials" class="hidden">
      <div class="field">
        <label for="login">Логин</label>
        <div class="row">
          <input id="login" type="text" readonly>
          <button class="copy" type="button" onclick="copyField('login', this)">Копировать</button>
        </div>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <div class="row">
          <input id="password" type="text" readonly>
          <button class="copy" type="button" onclick="copyField('password', this)">Копировать</button>
        </div>
      </div>

      <button id="copyAll" class="copy-all" type="button">
        Скопировать логин и пароль
      </button>
    </div>

    <div class="hint">
      Страница ожидает ссылку вида:
      <br>
      <code>login_password.html?id=123456</code>
    </div>
  </main>

  <script>
    // ==========================================
    // НАСТРОЙКА
    // Замени фразу на свою:
    // ==========================================
    const PHRASE = "SuperSecretPhrase";

    const params = new URLSearchParams(window.location.search);
    const rawId = params.get("id");

    const statusEl = document.getElementById("status");
    const credentialsEl = document.getElementById("credentials");
    const loginEl = document.getElementById("login");
    const passwordEl = document.getElementById("password");
    const copyAllBtn = document.getElementById("copyAll");

    function showStatus(text, type){
      statusEl.textContent = text;
      statusEl.className = "status " + type;
    }

    function normalizeId(value){
      if(!value) return null;
      const id = value.trim();

      // Сейчас разрешены только цифры.
      // Если ID в ЭлЖуре может содержать буквы — измени эту проверку.
      if(!/^\d+$/.test(id)) return null;

      return id;
    }

    const studentId = normalizeId(rawId);

    if(!studentId){
      showStatus(
        "Не удалось определить ученика. Откройте эту страницу по ссылке из ЭлЖура.",
        "error"
      );
    }else{
      const credential = PHRASE + studentId;

      loginEl.value = credential;
      passwordEl.value = credential;

      credentialsEl.classList.remove("hidden");
      showStatus("Данные для входа сформированы.", "ok");
    }

    async function copyText(text){
      try{
        await navigator.clipboard.writeText(text);
        return true;
      }catch(e){
        const temp = document.createElement("textarea");
        temp.value = text;
        temp.style.position = "fixed";
        temp.style.opacity = "0";
        document.body.appendChild(temp);
        temp.select();
        const ok = document.execCommand("copy");
        temp.remove();
        return ok;
      }
    }

    async function copyField(fieldId, button){
      const value = document.getElementById(fieldId).value;
      if(!value) return;

      const ok = await copyText(value);

      if(ok){
        const oldText = button.textContent;
        button.textContent = "Скопировано";
        setTimeout(() => button.textContent = oldText, 1200);
      }
    }

    copyAllBtn.addEventListener("click", async () => {
      const text =
        "Логин: " + loginEl.value + "\n" +
        "Пароль: " + passwordEl.value;

      const ok = await copyText(text);

      if(ok){
        const oldText = copyAllBtn.textContent;
        copyAllBtn.textContent = "Скопировано";
        setTimeout(() => copyAllBtn.textContent = oldText, 1200);
      }
    });
  </script>
</body>
</html>
